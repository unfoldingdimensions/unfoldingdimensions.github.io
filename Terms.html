    <!--

      does not.

      Same client-side redirect as Buy.html: GitHub Pages cannot issue a 301.
    -->

      http-equiv="refresh"
      content="0; url=https://unfoldingdimensions.com/terms"
    />

      location.replace("https://unfoldingdimensions.com/terms");
    </script>
