    <title>Buy a license, GHL Workflow Backup &amp; Audit</title>

    <!--
      Buying moved to unfoldingdimensions.com, which is the domain declared for
      payment verification. Extension v1.0.2 is already shipped and still sends
      people here, so this page has to stay alive and forward them.

      GitHub Pages serves static files and cannot issue a 301, so this is the
      client-side equivalent: canonical for crawlers, meta refresh for browsers
      with scripting off, location.replace for everyone else (replace, not assign,
      so Back does not bounce them straight back here), and a visible link for
      anything that honours none of the three.
    -->
    <link
      rel="canonical"
      href="https://unfoldingdimensions.com/ghl-workflow-backup#buy"
    />
    <meta
      http-equiv="refresh"
      content="0; url=https://unfoldingdimensions.com/ghl-workflow-backup#buy"
    />
    <meta name="robots" content="noindex, follow" />
    <script>
      location.replace(
        "https://unfoldingdimensions.com/ghl-workflow-backup#buy"
      );
    </script>

    <style>

        margin: 0;
        min-height: 100vh;

        font: 16px/1.6 system-ui, sans-serif;
        text-align: center;
      }
      a {
        color: #f0873a;
      }
    </style>
  </head>

    <main>
      <p>Buying a license has moved.</p>
