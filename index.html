    <!--
      The privacy policy now lives on unfoldingdimensions.com, the domain declared
      for payment verification, alongside /terms, /refunds, /shipping and /contact.

      This page is forwarded rather than left in place for the same reason the
      terms were: two reachable policy documents that can drift apart is worse
      than one. The markdown that used to live here had already fallen behind —
      it still described the payment provider as merchant of record after that
      stopped being true.

      Kept alive (not deleted) because this URL was registered as the Privacy
      Policy on the Chrome Web Store listing. Same client-side redirect as
      Buy.html and Terms.html: GitHub Pages cannot issue a 301.
    -->
    <link rel="canonical" href="https://unfoldingdimensions.com/privacy" />
    <meta http-equiv="refresh" content="0; url=https://unfoldingdimensions.com/privacy" />
    <meta name="robots" content="noindex, follow" />
    <script>
      location.replace("https://unfoldingdimensions.com/privacy");
    </script>

    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem;
             background:#060b18; color:#92a6c8;
             font:16px/1.6 system-ui, sans-serif; text-align:center; }

    </style>
